
[General]
	#Allows a player to teleport to a located structure when in creative mode, opped, or in cheat mode.
	allowTeleport = true
	#Allows players to view the precise coordinates and distance of a located structure on the HUD, rather than relying on the direction the compass is pointing.
	displayCoordinates = true
	#The maximum radius that will be searched for a structure. Raising this value will increase search accuracy but will potentially make the process more resource intensive.
	#Range: 0 ~ 1000000
	maxRadius = 1000000
	#A list of structures that the compass will not display in the GUI and will not be able to search for. Wildcard character * can be used to match any number of characters, and ? can be used to match one character. Ex: ["minecraft:stronghold", "minecraft:endcity", "minecraft:*village*"]
	structureBlacklist = ["towns_and_towers:exclusives/pillager_outpost_classic", "towns_and_towers:exclusives/pillager_outpost_iberian", "towns_and_towers:exclusives/pillager_outpost_mediterranean", "towns_and_towers:exclusives/pillager_outpost_oriental", "towns_and_towers:exclusives/pillager_outpost_rustic", "towns_and_towers:exclusives/pillager_outpost_swedish", "towns_and_towers:exclusives/pillager_outpost_tudor", "towns_and_towers:exclusives/village_classic", "towns_and_towers:exclusives/village_iberian", "towns_and_towers:exclusives/village_mediterranean", "towns_and_towers:exclusives/village_nilotic", "towns_and_towers:exclusives/village_piglin", "towns_and_towers:exclusives/village_rustic", "towns_and_towers:exclusives/village_swedish", "towns_and_towers:exclusives/village_tudor", "towns_and_towers:exclusives/village_wandering_trader_camp", "arboria:**", "touhou_little_maid_spell:fairy_maid_cafe", "totw_modded:**", "ati_structures:spider_nest", "goetyawaken:glacial_ghost_house"]
	#The maximum number of samples to be taken when searching for a structure.
	#Range: 0 ~ 100000000
	maxSamples = 100000
	#If this option is enabled, then the compass will clear the cache of previously found structures when the structure couldn't found.
	cleanCache = true
	#If this option is enabled, then the compass will search alex cave
	couldFoundAlexCaves = true
	#Load config.json
	customResource = false

