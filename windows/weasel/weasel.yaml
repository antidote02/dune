config_version: '0.25'
app_options:
  cmd.exe:
    ascii_mode: true
  conhost.exe:
    ascii_mode: true
show_notifications: true
show_notifications_time: 1200
global_ascii: false
style:
  color_scheme: default
  color_scheme_dark: ''
  font_face: Cascadia Mono, 新宋体
  label_font_face: Cascadia Mono
  comment_font_face: Cascadia Mono
  font_point: 12
  label_font_point: 12
  comment_font_point: 12
  inline_preedit: false
  preedit_type: composition
  fullscreen: false
  horizontal: false
  vertical_text: false
  vertical_text_left_to_right: false
  vertical_text_with_wrap: false
  vertical_auto_reverse: false
  label_format: '%s.'
  mark_text: ''
  ascii_tip_follow_cursor: false
  enhanced_position: false
  display_tray_icon: false
  antialias_mode: default
  candidate_abbreviate_length: 0
  hover_type: none
  paging_on_scroll: false
  click_to_capture: false
  layout:
    baseline: 0
    linespacing: 0
    align_type: center
    max_height: 0
    max_width: 0
    min_height: 0
    min_width: 10
    border_width: 0
    margin_x: 12
    margin_y: 12
    spacing: 0
    candidate_spacing: 10
    hilite_spacing: 4
    shadow_radius: 0
    shadow_offset_x: 0
    shadow_offset_y: 0
    corner_radius: 12
    round_corner: 3
preset_color_schemes:
  default:
    name: 示例
    author: 无
    back_color: 0xFFFFFFFF
    border_color: 0x00000000
    text_color: 0xFF000000
    comment_text_color: 0xFF000000
    label_color: 0xFF000000
    shadow_color: 0x00000000
    hilited_text_color: 0xFF000000
    hilited_back_color: 0x00FFFFFF
    hilited_shadow_color: 0x00000000
    hilited_candidate_text_color: 0xFF000000
    hilited_candidate_back_color: 0xFFBFBFBF
    hilited_candidate_shadow_color: 0x00000000
    hilited_candidate_border_color: 0x00000000
    hilited_label_color: 0xFF000000
    hilited_mark_color: 0x00000000
    hilited_comment_text_color: 0xFF000000
    candidate_text_color: 0xFF000000
    candidate_back_color: 0x00000000
    candidate_shadow_color: 0x00000000
